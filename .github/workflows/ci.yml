name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MuNTrade.sln
      - run: dotnet build MuNTrade.sln -c Release --no-restore
      - run: dotnet test MuNTrade.sln -c Release --no-build

  demo:
    name: Build the static demo
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MuNTrade.sln
      - name: Verify generated sample content
        run: bash scripts/verify-samples.sh
      - name: Run backtest and report twice and compare hashes
        shell: bash
        run: |
          run_once() {
            dotnet run --project src/MuNTrade.Demo.Cli -c Release -- backtest
            dotnet run --project src/MuNTrade.Demo.Cli -c Release -- report
            sha256sum out/backtest_summary.csv site/index.html | cut -d ' ' -f 1
          }
          first_hashes="$(run_once | tail -n 2)"
          second_hashes="$(run_once | tail -n 2)"
          echo "$first_hashes"
          test "$first_hashes" = "$second_hashes"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: demo
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
