name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MuNTrade.sln
      - run: dotnet build MuNTrade.sln -c Release --no-restore
      - run: dotnet test MuNTrade.sln -c Release --no-build

  demo:
    name: Build the static demo
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MuNTrade.sln
      - name: Regenerate samples and confirm they are committed
        run: |
          dotnet run --project tools/MuNTrade.SampleData -c Release --no-restore
          git diff --exit-code -- samples
      - name: Run backtest twice and compare summary hashes
        shell: bash
        run: |
          dotnet run --project src/MuNTrade.Demo.Cli -c Release -- backtest
          first_hash="$(sha256sum out/backtest_summary.csv | cut -d ' ' -f 1)"
          dotnet run --project src/MuNTrade.Demo.Cli -c Release -- backtest
          second_hash="$(sha256sum out/backtest_summary.csv | cut -d ' ' -f 1)"
          test "$first_hash" = "$second_hash"
      - name: Generate the static report
        run: dotnet run --project src/MuNTrade.Demo.Cli -c Release -- report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: demo
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
